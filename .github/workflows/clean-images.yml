name: Cleanup old images
on:
  schedule:
    - cron: "0 0 1 * *" # Run on the first day of every month
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete_images:
    name: Delete old images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete images older than 30 days
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: wepos-dx
          older-than: 30 days
          delete-orphaned-images: true
          keep-n-tagged: 10
          keep-n-untagged: 10
